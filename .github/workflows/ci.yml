name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend build, lint-equivalent (tsc), unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix backend/functions ci
      - run: npm --prefix backend/functions run build
      - run: npm --prefix backend/functions test

  emulator-suite:
    name: Firestore/Storage rules + integration tests (real emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix backend/functions ci
      - run: npm run test:billing

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Backend -- kode yang BENERAN di-deploy ke Cloud Functions. Gate
      # BLOCKING di level high/critical (bersih per 10 Okt 2026).
      - run: npm --prefix backend/functions ci
      - run: npm --prefix backend/functions audit --audit-level=high
      # Root -- firebase-tools/firebase SDK, dev tooling LOKAL buat
      # emulator/test, TIDAK PERNAH jalan di server/produksi. SENGAJA
      # informational (continue-on-error), BUKAN blocking -- CVE yang ada
      # per 10 Okt 2026 semua di jalur proxy/network-client firebase-tools
      # yang gak kepake buat "jalanin emulator lokal", dan fix-nya minta
      # downgrade besar (firebase-tools 14.x, breaking) yang beresikonya
      # lebih gede dari CVE itu sendiri. Jangan `npm audit fix --force`
      # tanpa tes ulang semua emulator suite manual dulu.
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    name: Mobile (Flutter) analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      # Regenerate token lalu DIFF terhadap yang di-commit -- nangkep kasus
      # tokens.json diubah tapi casa_tokens.dart lupa di-regenerate ulang
      # (npm run generate:tokens).
      - run: node scripts/generate-design-tokens.js
      - run: git diff --exit-code apps/mobile/lib/core/theme/casa_tokens.dart
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

  # BELUM ADA job admin -- apps/admin masih 0 baris kode (README
  # placeholder doang, lihat IMPLEMENTATION_PROGRESS.md). Tambahkan job
  # terpisah begitu mulai di-scaffold.
  #
  # Mobile job di atas SENGAJA cuma analyze+test (Dart-level, jalan di
  # Linux) -- BUKAN build iOS/Android asli (butuh runner macOS buat iOS,
  # mahal & lambat buat tiap push). Build native + jalan di simulator
  # beneran (sudah dites manual 10 Okt 2026 di iPhone 18 Pro Simulator,
  # lihat IMPLEMENTATION_PROGRESS.md) tetap langkah manual/rilis, bukan
  # gate CI tiap push.
